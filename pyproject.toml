[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachguard"
version = "1.0.0"
description = "Refined. Secure. Connected. — Reachability-aware dependency vulnerability scanner for Python"
readme = "README.md"
authors = [
    { name = "Chaitanya Bhujbal", email = "chaitanyabhujbal912006@gmail.com" }
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["security", "vulnerability", "cve", "reachability", "call-graph", "osv", "static-analysis", "sbom", "sast"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pycg>=0.0.6",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",      # HTTP mocking for OSV tests
]

[project.urls]
Homepage = "https://github.com/chaitanyabhujbal912006-afk/reachguard"
Repository = "https://github.com/chaitanyabhujbal912006-afk/reachguard.git"
"Bug Tracker" = "https://github.com/chaitanyabhujbal912006-afk/reachguard/issues"
Changelog = "https://github.com/chaitanyabhujbal912006-afk/reachguard/blob/main/CHANGELOG.md"

[project.scripts]
reachguard = "reachguard_core.cli:app"

# ── pytest config ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

# ── coverage config ───────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["reachguard_core"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50

# ── ruff linting config ───────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",   # line too long — handled by line-length above
]

